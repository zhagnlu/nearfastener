# Include inside the existing www.nearfastener.com HTTPS server block.
# Inspect the original client URI so nginx's internal index resolution cannot loop.
# The CDN must enforce client HTTPS separately from its origin protocol.
if ($request_uri ~ "^(.*/)index[.]html(?:[?].*)?$") {
    return 301 https://www.nearfastener.com$1$is_args$args;
}
